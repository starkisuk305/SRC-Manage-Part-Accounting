/* 운영국 회계
   방향: 교회 정산서의 남색 잉크와 노란 합계 칸에서 출발해, 선을 줄이고 여백을 넓힌 차분한 장부.
   기억에 남는 한 가지: 이번 달 받을 금액에 긋는 형광펜 표시. 나머지는 조용하게. */

:root {
  --bg: #F6F7F9;
  --panel: #FFFFFF;
  --ink: #18202E;
  --ink-2: #4A5365;
  --ink-3: #7F8798;
  --line: #E7EAF0;
  --line-2: #F0F2F6;
  --navy: #1F3A63;
  --navy-2: #172C4C;
  --navy-soft: #EBF0F7;
  --hl: #FFD84D;
  --hl-soft: #FFF3C4;
  --gray-cell: #F1F3F6;
  --err: #C2362B;
  --err-bg: #FDF0EE;
  --warn: #8A5B00;
  --warn-bg: #FFF7E0;
  --ok: #1E7350;
  --ok-bg: #E9F6EF;
  --r: 12px;
  --r-sm: 8px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  --rail: 236px;
  --tab: 62px;
  /* 정산서 미리보기용(교회 양식 색) */
  --band: #DBE5F1;
  --total: #FFC000;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
.shell { min-height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  letter-spacing: -0.005em;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--navy); text-underline-offset: 3px; }
.num, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ---------- 틀 ---------- */
.rail {
  position: fixed; inset: 0 auto 0 0; width: var(--rail);
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 14px 18px; gap: 20px; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; padding: 0 6px; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  background: linear-gradient(var(--hl), var(--hl)) 0 100% / 100% 36% no-repeat, var(--navy);
  box-shadow: inset 0 0 0 2px var(--navy);
}
.main { margin-left: var(--rail); padding: 36px 44px 140px; max-width: calc(1140px + var(--rail)); outline: none; }
.topbar, .tabbar { display: none; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .tabbar a {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 15px;
}
.nav a:hover { background: var(--line-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
.nav svg { width: 19px; height: 19px; flex: none; opacity: .9; }
.nav .count { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--err); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.topbar svg { width: 20px; height: 20px; }

.month-picker { display: flex; align-items: center; gap: 2px; background: var(--line-2); border-radius: 10px; padding: 3px; }
.month-picker button {
  border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 16px;
}
@media (hover: hover) { .month-picker button:hover { background: var(--panel); color: var(--ink); } }
.month-picker .label { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
.topbar .month-picker { background: transparent; padding: 0; gap: 0; }
.topbar .month-picker .btn { flex: none; background: transparent; margin-left: 2px; min-height: 36px; padding: 6px 8px; color: var(--ink-2); }

.month-picker .today {
  border: 0; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--navy);
  background: var(--panel); border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 2px rgba(16, 24, 40, .08); white-space: nowrap; flex: none; width: auto; height: auto;
}
.rail .month-picker { flex-wrap: wrap; }
.rail .month-picker .today { flex-basis: 100%; margin-top: 3px; }
@media (max-width: 420px) { body.off-month .topbar .brand-name { display: none; } }

.sync-box { margin-top: auto; font-size: 12.5px; color: var(--ink-3); padding: 12px 8px 0; border-top: 1px solid var(--line); line-height: 1.7; }
.sync-box .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
.sync-box .dot.ok { background: var(--ok); }
.sync-box .dot.err { background: var(--err); }
.sync-box .dot.busy { background: var(--hl); }
.sync-box button { margin-top: 10px; width: 100%; }

.fab {
  position: fixed; right: 32px; bottom: 32px; z-index: 6;
  background: var(--navy); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
  padding: 15px 22px; border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(31, 58, 99, .55);
  display: inline-flex; align-items: center; gap: 8px;
}
.fab::before { content: "+"; font-size: 20px; line-height: 1; font-weight: 500; }
.fab:hover { background: var(--navy-2); }

@media (max-width: 860px) {
  .rail { display: none; }
  .topbar {
    display: flex; position: sticky; top: 0; z-index: 5; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line); padding-top: max(10px, env(safe-area-inset-top));
  }
  .topbar .brand { padding: 0; }
  .topbar .brand-name { font-size: 15.5px; }
  .topbar .month-picker .label { min-width: 88px; font-size: 14.5px; }
  .main { margin-left: 0; padding: 20px 16px calc(var(--tab) + 120px); }
  .tabbar {

  }

}

/* ---------- 글자와 공통 ---------- */

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; line-height: 1.5; }

/* ---------- 점검 ---------- */

/* ---------- 이번 달 합계: 형광펜 ---------- */
.ledger-head {

}

.dates { display: flex; gap: 8px 22px; flex-wrap: wrap; margin: 14px 2px 0; font-size: 14px; color: var(--ink-2); }

/* ---------- 할 일 ---------- */

.todo li a::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #B6BECC; flex: none; transform: translateY(-2px); }
.todo li.warn a::before { background: #E8B21E; }
.todo li.err a { color: var(--err); font-weight: 600; }

table.t.year { font-size: 13px; }

/* ---------- 영수증 목록 ---------- */

}

.thumb { width: 60px; height: 60px; border-radius: 10px; background: var(--line-2) center/cover no-repeat; border: 1px solid var(--line); }

@media (max-width: 560px) {

}
.empty-state { padding: 44px 20px; text-align: center; color: var(--ink-2); }

.form-section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px 6px; margin-bottom: 14px; }

  counter-increment: step; content: counter(step);
  width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff;
  font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none;
}
details.more { padding-bottom: 14px; }

details.more > summary::-webkit-details-marker { display: none; }

.claim-line { display: flex; gap: 12px; align-items: baseline; padding: 14px 16px; background: var(--navy-soft); border-radius: 12px; margin-bottom: 16px; flex-wrap: wrap; }

}

@media (max-width: 860px) { .savebar { bottom: calc(var(--tab) + env(safe-area-inset-bottom)); } }

/* ---------- 정산서 미리보기 (교회 양식 색은 그대로) ---------- */
.report-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
@media (max-width: 1180px) { .report-grid { grid-template-columns: minmax(0, 1fr); } }
.form-preview { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; overflow-x: auto; box-shadow: 0 1px 0 var(--line-2); }

table.f { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 600px; }

/* ---------- 표, 막대 ---------- */
.bar { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); border-radius: 4px; }
.bar.over > i { background: var(--err); }

.table-wrap { overflow-x: auto; }

/* ---------- 모달, 알림 ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(17, 24, 39, .5); z-index: 50; display: grid; place-items: center; padding: 16px; backdrop-filter: blur(2px); }

  .modal-back { padding: 0; }
  .modal { border-radius: 0; height: 100%; max-height: 100%; }

}

.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }

.notice { padding: 13px 16px; border-radius: 12px; background: var(--navy-soft); color: var(--navy); font-size: 14px; margin-bottom: 16px; line-height: 1.55; }

body.member .month-picker { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- 정산 현황 ---------- */
.board-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }

.board-sum .v { font-size: 18px; font-weight: 750; letter-spacing: -0.02em; }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.board-head, .board-row { display: grid; grid-template-columns: minmax(84px, 1.1fr) 0.8fr 1fr 2.4fr; gap: 12px; align-items: center; padding: 11px 18px; }
.board-head { font-size: 12.5px; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); padding-top: 10px; padding-bottom: 10px; }
.board-head .a, .board-row .a { text-align: right; }
.board-row { border-bottom: 1px solid var(--line-2); color: inherit; text-decoration: none; transition: background .12s ease; }
.board-row:last-child { border-bottom: 0; }
.board-row:hover { background: #FAFBFC; }
.board-row .m { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .c { color: var(--ink-2); font-size: 14px; }
.board-row .a { font-weight: 700; }
.board-row .p { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; padding-left: 12px; }
.pill { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.err { background: var(--err-bg); color: var(--err); }
.pill.none { background: transparent; color: var(--ink-3); font-weight: 500; }
.more-table { margin-top: 14px; }
.more-table > summary { cursor: pointer; color: var(--ink-2); font-size: 14px; margin-bottom: 10px; }
@media (max-width: 860px) {
  .board-sum { grid-template-columns: 1fr 1fr; }
  .board-head { display: none; }
  .board-row { grid-template-columns: 1fr auto; grid-template-areas: "m a" "c c" "p p"; gap: 4px 12px; padding: 13px 16px; }
  .board-row .m { grid-area: m; } .board-row .a { grid-area: a; } .board-row .c { grid-area: c; font-size: 13px; }
  .board-row .p { grid-area: p; padding-left: 0; margin-top: 4px; }
}

/* ---------- 회계 확인 ---------- */
.review-box { display: flex; flex-direction: column; gap: 10px; }
.review-box .row { gap: 8px; }
.review-box textarea { min-height: 64px; background: var(--panel); }
.review-note { margin-top: 6px; padding: 8px 12px; background: rgba(255, 255, 255, .7); border-radius: 8px; color: var(--ink); white-space: pre-wrap; }
.notice.review { background: var(--navy-soft); color: var(--navy); }
.ledger-row .st { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.ledger-row .st.ok { color: var(--ok); }
.ledger-row .st.warn { color: var(--warn); }
.ledger-row .st.err { color: var(--err); }
.chip.review { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
.ask-list { border-color: #F0CFCB; }
.ask-row { display: block; padding: 13px 18px; border-bottom: 1px solid var(--line-2); color: inherit; text-decoration: none; }
.ask-row:last-child { border-bottom: 0; }
.ask-row:hover { background: #FFF8F7; }
.ask-row .t { display: flex; justify-content: space-between; gap: 10px; font-weight: 650; }
.ask-row .note { display: block; margin-top: 4px; color: var(--err); font-size: 14px; white-space: pre-wrap; }
.ledger-row.nonum { grid-template-columns: 60px minmax(0, 1fr) auto; }
.ledger-row.nonum > .no { display: none; }
@media (max-width: 560px) { .ledger-row.nonum { grid-template-columns: minmax(0, 1fr) auto; padding-left: 16px; } }

/* ---------- 연결 안내, 읽기 전용 ---------- */
.connect-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--hl); border-radius: 14px; padding: 18px 22px; margin-bottom: 20px; }
.connect-card h2 { margin: 0 0 6px; font-size: 17px; }
.connect-card p { margin: 0 0 10px; color: var(--ink-2); font-size: 14.5px; max-width: 70ch; }
.read-only .form-section .chip:disabled, .read-only .form-section .seg button:disabled { cursor: default; opacity: 1; }
.read-only .form-section input:disabled, .read-only .form-section select:disabled, .read-only .form-section textarea:disabled { background: var(--line-2); color: var(--ink); opacity: 1; }

/* 홈에서 바로 사진 고르기 */
.quick-pick { width: 100%; min-height: 64px; flex-direction: column; gap: 2px; font-size: 17px; margin-bottom: 18px; cursor: pointer; }
.quick-pick span { font-size: 12.5px; font-weight: 500; opacity: .8; }

/* 통장 장부 */
.ledger-box { margin-bottom: 14px; }
.ledger-box .lb-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ledger-box .k { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.ledger-box .v { font-size: 18px; font-weight: 750; }
.ledger-box .v.in { color: var(--ok); }
.ledger-box .lb-by { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--ink-2); }
.ledger-box .lb-by b { color: var(--ink); min-width: 32px; }
.warn-text { color: var(--err); font-weight: 600; }
@media (max-width: 560px) { .ledger-box .lb-row { grid-template-columns: 1fr 1fr; } }

</style>
</head>
